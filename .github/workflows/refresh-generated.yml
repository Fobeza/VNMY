name: Refresh generated VNMY files

on:
  push:
    branches: [build/refresh-generated-ui]

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bundle.js vnmy.html stories/index.json stories/builtin.js
          if ! git diff --cached --quiet; then
            git commit -m "build: refresh generated VNMY assets"
            git push origin HEAD:build/refresh-generated-ui
          fi
