name: Engine and stories
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: git diff --exit-code -- bundle.js stories/builtin.js stories/index.json vnmy.html
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
